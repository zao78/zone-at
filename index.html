];
const $=s=>document.querySelector(s),court=$('#court');let pi=0,si=0,timer=null;
function zoneY(k,y){ if(k==='D1'||k==='D2') return Math.max(34,Math.min(58,y*0.65+9)); if(k==='D4') return Math.max(18,Math.min(38,y*0.65)); return Math.max(22,Math.min(42,y*0.70+2)); }
const initialBall=['O1','O1','O3','O2','O3']; // possession immediately before STEP 1
function screenPoint(id,pos){const y=id[0]==='D'?zoneY(id,pos[1]):pos[1];return [pos[0]*6,y*5.6]}
function actionInfo(x,index){
 const cur=x.steps[index], prev=index?x.steps[index-1]:null;
 const from=prev?prev.ball:initialBall[pi], to=cur.ball;
 if(from&&to&&from!==to) return {type:'pass',label:'パス',from,to};
 if(/ドリブル/.test(cur.t)) return {type:'dribble',label:'ドリブル',from:to,to};
 return {type:'move',label:'ボールなしの移動',from:null,to:null};
}
function drawAction(x,index){
 const info=actionInfo(x,index), path=$('#actionPath'), group=$('#moveGroup');
 group.innerHTML='';
 path.removeAttribute('d'); path.removeAttribute('marker-end');
 const curPos=merged(x.steps[index]), prevPos=index?merged(x.steps[index-1]):merged({p:{}});
 Object.keys(curPos).filter(id=>id[0]==='O').forEach(id=>{
   const a=screenPoint(id,prevPos[id]),b=screenPoint(id,curPos[id]);
   const dist=Math.hypot(b[0]-a[0],b[1]-a[1]);
   if(dist<12 || (info.type==='pass' && id===info.to)) return;
   const dx=b[0]-a[0],dy=b[1]-a[1],len=dist,cut=22;
   const x1=a[0]+dx/len*cut,y1=a[1]+dy/len*cut,x2=b[0]-dx/len*cut,y2=b[1]-dy/len*cut;
   const q=document.createElementNS('http://www.w3.org/2000/svg','path');
   q.setAttribute('d',`M${x1} ${y1} L${x2} ${y2}`);q.setAttribute('fill','none');q.setAttribute('stroke','#287d4f');q.setAttribute('stroke-width','5');q.setAttribute('stroke-dasharray','4 9');q.setAttribute('stroke-linecap','round');q.setAttribute('marker-end','url(#arrowMove)');group.appendChild(q);
 });
 if(info.type==='move') return info;
 const cur=curPos;
 const prev=prevPos;
 let a,b;
 if(info.type==='pass'){a=screenPoint(info.from,prev[info.from]);b=screenPoint(info.to,cur[info.to]);}
 else {a=screenPoint(info.to,prev[info.to]);b=screenPoint(info.to,cur[info.to]);}
 const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,cut=24;
 a=[a[0]+dx/len*cut,a[1]+dy/len*cut];b=[b[0]-dx/len*cut,b[1]-dy/len*cut];
 if(info.type==='pass'){path.setAttribute('d',`M${a[0]} ${a[1]} L${b[0]} ${b[1]}`);path.setAttribute('stroke','#7b4bc4');path.setAttribute('stroke-dasharray','14 10');path.setAttribute('marker-end','url(#arrowPass)');}
 else {const mx=(a[0]+b[0])/2+dy*.12,my=(a[1]+b[1])/2-dx*.12;path.setAttribute('d',`M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}`);path.setAttribute('stroke','#dd6b20');path.removeAttribute('stroke-dasharray');path.setAttribute('marker-end','url(#arrowDribble)');}
 return info;
}
function stepHtml(x,index){const info=drawAction(x,index),s=x.steps[index];return `<span class="actionBadge ${info.type}">${info.label}</span><strong>STEP ${index+1} / ${x.steps.length}</strong><br>${s.t}`}

const els={}; Object.keys(base).forEach(id=>{const d=document.createElement('div');d.id=id;d.className='player '+(id[0]=='O'?'off':'def');d.textContent=id[1];court.appendChild(d);els[id]=d});
const liveBall=document.createElement('div');liveBall.className='liveBall';liveBall.setAttribute('aria-label','ボール');court.appendChild(liveBall);let ballTimer=null;
function merged(step){const p={};Object.keys(base).forEach(k=>p[k]=[...base[k]]);Object.assign(p,step.p||{});return p}
function ballAt(id,pos,duration=0){
 const y=id[0]==='D'?zoneY(id,pos[1]):pos[1];
 liveBall.style.transitionDuration=duration+'ms';liveBall.style.left=pos[0]+'%';liveBall.style.top=y+'%';
}
function smoothPass(fromId,fromPos,toId,toPos){
 const fy=fromId[0]==='D'?zoneY(fromId,fromPos[1]):fromPos[1];
 const ty=toId[0]==='D'?zoneY(toId,toPos[1]):toPos[1];
 const fx=fromPos[0],tx=toPos[0],mx=(fx+tx)/2,my=(fy+ty)/2-2.2;
 liveBall.getAnimations().forEach(a=>a.cancel());
 liveBall.style.transitionDuration='0ms';liveBall.style.left=fx+'%';liveBall.style.top=fy+'%';
 const anim=liveBall.animate([
   {left:fx+'%',top:fy+'%',transform:'scale(1)'},
   {left:(fx+(mx-fx)*0.55)+'%',top:(fy+(my-fy)*0.55)+'%',transform:'scale(1.06)',offset:.45},
   {left:mx+'%',top:my+'%',transform:'scale(1.08)',offset:.58},
   {left:tx+'%',top:ty+'%',transform:'scale(1)'}
 ],{duration:1100,easing:'cubic-bezier(.33,.05,.2,1)',fill:'forwards'});
 anim.onfinish=()=>{liveBall.style.left=tx+'%';liveBall.style.top=ty+'%';liveBall.style.transform='scale(1)';anim.cancel()};
}
function stopBallTimer(){if(ballTimer){clearTimeout(ballTimer);ballTimer=null}}
function placeBallStatic(x,index){stopBallTimer();liveBall.classList.remove('dribbling');const p=merged(x.steps[index]);const holder=index===0?x.steps[0].ball:x.steps[index].ball;ballAt(holder,p[holder],0)}
function animateBallForStep(x,index){
 stopBallTimer();const info=actionInfo(x,index),cur=merged(x.steps[index]),prev=index?merged(x.steps[index-1]):merged({p:{}});
 const previousHolder=index?x.steps[index-1].ball:initialBall[pi];
 liveBall.classList.remove('dribbling');ballAt(previousHolder,prev[previousHolder],0);
 if(info.type==='pass'&&info.from&&info.to){
   /* Cutter and defence start first. The passer releases after the window opens. */
   ballTimer=setTimeout(()=>{smoothPass(info.from,prev[info.from],info.to,cur[info.to]);ballTimer=null},500);
 }else if(info.type==='dribble'){
   liveBall.classList.add('dribbling');ballTimer=setTimeout(()=>{ballAt(info.to,cur[info.to],1900);ballTimer=null},80);
 }else{
   /* On an off-ball action, the ball stays with the handler and follows only if that handler relocates. */
   ballTimer=setTimeout(()=>{ballAt(x.steps[index].ball,cur[x.steps[index].ball],1900);ballTimer=null},80);
 }
}

function render(){clearInterval(timer);timer=null;const x=patterns[pi],s=x.steps[si],p=merged(s);$('#num').textContent=pi+1;$('#patternTitle').textContent=x.title;$('#aim').textContent='ねらい：'+x.aim;Object.keys(els).forEach(k=>{els[k].style.left=p[k][0]+'%';els[k].style.top=(k[0]==='D' ? zoneY(k,p[k][1]) : p[k][1])+'%';els[k].classList.remove('ball');els[k].classList.toggle('focus',(s.f||[]).includes(k))});placeBallStatic(x,si);$('#stepText').innerHTML=stepHtml(x,si);$('#play').textContent='▶ 再生';renderSide();renderTabs()}
function renderTabs(){const t=$('#tabs');t.innerHTML='';patterns.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='tab'+(i===pi?' active':'');b.textContent=(i+1)+'. '+p.title;b.onclick=()=>{pi=i;si=0;render()};t.appendChild(b)})}
function renderSide(){const x=patterns[pi];$('#notes').innerHTML=x.notes.map(n=>{const [h,v]=n.split('|');const cls=h==='注意'?'warn':h==='ねらい'?'look':'key';return `<div class="note ${cls}"><strong>${h}</strong>${v}</div>`}).join('');$('#question').textContent='確認：'+x.q;$('#choices').innerHTML='';x.choices.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=c;b.onclick=()=>answer(i,b);$('#choices').appendChild(b)});$('#feedback').textContent='選択肢をタップしてください。'}
function answer(i,b){document.querySelectorAll('.choice').forEach((n,j)=>{n.disabled=true;if(j===patterns[pi].a)n.classList.add('correct')});if(i!==patterns[pi].a)b.classList.add('wrong');$('#feedback').textContent=(i===patterns[pi].a?'〇 ':'△ ')+patterns[pi].fb}
$('#next').onclick=()=>{if(si<patterns[pi].steps.length-1){si++;const x=patterns[pi],st=x.steps[si],p=merged(st);Object.keys(els).forEach(k=>{els[k].style.left=p[k][0]+'%';els[k].style.top=(k[0]==='D'?zoneY(k,p[k][1]):p[k][1])+'%';els[k].classList.toggle('focus',(st.f||[]).includes(k))});animateBallForStep(x,si);$('#stepText').innerHTML=stepHtml(x,si)}};$('#prev').onclick=()=>{if(si>0)si--;render()};$('#reset').onclick=()=>{si=0;render()};$('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#play').textContent='▶ 再生';return} if(si===patterns[pi].steps.length-1)si=0;render();$('#play').textContent='⏸ 一時停止';timer=setInterval(()=>{if(si<patterns[pi].steps.length-1){si++;const x=patterns[pi],s=x.steps[si],p=merged(s);Object.keys(els).forEach(k=>{els[k].style.left=p[k][0]+'%';els[k].style.top=(k[0]==='D' ? zoneY(k,p[k][1]) : p[k][1])+'%';els[k].classList.remove('ball');els[k].classList.toggle('focus',(s.f||[]).includes(k))});animateBallForStep(x,si);$('#stepText').innerHTML=stepHtml(x,si)}else{clearInterval(timer);timer=null;$('#play').textContent='▶ 再生'}},3300)};
render();
})();
</script>
</body></html>
